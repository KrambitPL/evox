[project]
name = "evox-api"
version = "0.1.0"
description = "Evox FastAPI control-plane contracts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "actian-vectorai-client==1.0.1",
    "band-sdk==1.2.0",
    "boto3>=1.35,<2.0",
    "evoagentx==0.1.4",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
]

[project.scripts]
evox-worker = "evox_api.jobs.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
